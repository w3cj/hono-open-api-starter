# bunfig.toml — إعدادات Bun الرسمية للمشروع

[install]
exact = true

[test]
# التغطية مفعّلة دايماً عشان بوابة `bun run test` تفرض العتبة في كل تشغيل
coverage = true
# العتبة العامة: 80% للاسطر والدوال (ARCHITECTURE — تغطية 80% عام).
# ملاحظة مهمة: Bun بيفحص العتبة لكل ملف لوحده، مش على متوسط الملفات كلها.
# عتبة الصلاحيات 95% هتتفرض مع 4.6 — Bun مش بيدعم عتبات per-path،
# فهتتطبق وقتها على ملفات الصلاحيات (تشدد مؤقت أو فحص lcov مخصص).
coverageThreshold = { lines = 0.8, functions = 0.8 }
# ملفات الاختبار نفسها خارج حساب التغطية
coverageSkipTestFiles = true
